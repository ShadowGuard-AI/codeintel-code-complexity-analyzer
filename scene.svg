<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Loft in three depths: a distant gull crosses one tall window at long intervals, daylight creeps across the ranked panes from left to right, and the corner of the folded polishing cloth lifts a fraction in a draught and settles">
